<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: #F8B4D9; }
      .foreground { fill: #1a1a1a; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #1a1a1a; }
      .foreground { fill: #F8B4D9; }
    }
  </style>
  <rect class="background" width="180" height="180" rx="37" />
  <g transform="translate(90, 90)">
    <!-- Sock shape -->
    <path class="foreground"
      d="M-30 -40 
         Q-30 -50 -20 -50 
         L20 -50 
         Q30 -50 30 -40 
         L30 20 
         Q30 30 20 30 
         L-20 30 
         Q-30 30 -30 20 
         Z
         M-30 20
         Q-30 40 -20 50
         L-10 60
         Q0 70 10 60
         L20 50
         Q30 40 30 20"
      fill="none"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Stripes -->
    <path class="foreground"
      d="M-30 -20 L30 -20"
      stroke-width="3"
      stroke-linecap="round"
    />
    <path class="foreground"
      d="M-30 0 L30 0"
      stroke-width="3"
      stroke-linecap="round"
    />
    <path class="foreground"
      d="M-30 20 L30 20"
      stroke-width="3"
      stroke-linecap="round"
    />
    <!-- Toe line -->
    <path class="foreground"
      d="M-10 60 Q0 65 10 60"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
    />
  </g>
</svg>