<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: #F8B4D9; }
      .foreground { fill: #1a1a1a; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #1a1a1a; }
      .foreground { fill: #F8B4D9; }
    }
  </style>
  <rect class="background" width="180" height="180" rx="37" />
  <g transform="translate(90, 90)">
    <!-- Sock body -->
    <path class="foreground"
      d="M-25 -45 
         L25 -45 
         Q35 -45 35 -35 
         L35 15 
         Q35 25 25 25 
         L-25 25 
         Q-35 25 -35 15 
         L-35 -35 
         Q-35 -45 -25 -45 
         Z"
      fill="currentColor"
    />
    <!-- Sock heel/toe -->
    <path class="foreground"
      d="M-35 15 
         Q-35 35 -25 45 
         L-15 55 
         Q-5 65 5 55 
         L15 45 
         Q25 35 25 15 
         L25 25 
         L-25 25 
         Z"
      fill="currentColor"
    />
    <!-- Stripes -->
    <rect class="background" x="-35" y="-25" width="70" height="6" />
    <rect class="background" x="-35" y="-5" width="70" height="6" />
    <rect class="background" x="-35" y="15" width="70" height="6" />
  </g>
</svg>